version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: crop_monitoring_db
    environment:
      POSTGRES_DB: crop_monitoring
      POSTGRES_USER: crop_user
      POSTGRES_PASSWORD: crop_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crop_user -d crop_monitoring"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django Backend
  backend:
    build: ./backend
    container_name: crop_monitoring_backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://crop_user:crop_password@db:5432/crop_monitoring
      DEBUG: "True"
      SECRET_KEY: django-insecure-docker-dev-key
      ALLOWED_HOSTS: localhost,127.0.0.1
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
